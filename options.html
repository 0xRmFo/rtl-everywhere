<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إعدادات RTL Everywhere</title><style>body{font-family:Segoe UI,Tahoma,Arial;max-width:680px;margin:40px auto;padding:0 20px;color:#20242c}h1{font-size:26px}p{color:#5f6877;line-height:1.8}.card{border:1px solid #dfe3ea;border-radius:12px;padding:20px;margin-top:20px}label{display:flex;gap:10px;margin:16px 0;font-size:16px}button{padding:10px 18px;border:0;border-radius:8px;background:#4f7cff;color:white;cursor:pointer}</style></head><body><h1>RTL Everywhere</h1><p>تحكم في طريقة ترتيب النصوص على المواقع. الإضافة تستثني تلقائيًا الأكواد وحقول الإدخال والعناصر التفاعلية الحساسة.</p><div class="card"><label><input id="enabled" type="checkbox"> تفعيل الإضافة</label><label><input id="smart" type="checkbox"> الوضع الذكي للنص المختلط</label><label><input id="forceLayout" type="checkbox"> فرض اتجاه RTL على تخطيط الصفحة</label><button id="save">حفظ الإعدادات</button><span id="status"></span></div><script src="options.js"></script></body></html>
