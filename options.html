<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>RTL Everywhere Settings</title>
  <style>
    body{font-family:Segoe UI,Tahoma,Arial;max-width:680px;margin:40px auto;padding:0 20px;color:#20242c}
    h1{font-size:26px}p{color:#5f6877;line-height:1.8}
    .card{border:1px solid #dfe3ea;border-radius:12px;padding:20px;margin-top:20px}
    label{display:flex;gap:10px;margin:16px 0;font-size:16px}
    button{padding:10px 18px;border:0;border-radius:8px;background:#4f7cff;color:white;cursor:pointer}
  </style>
</head>
<body>
  <h1>RTL Everywhere</h1>
  <p>Choose how text appears across websites. Code blocks, input fields, and known editors are excluded from direct text processing.</p>
  <div class="card">
    <label><input id="enabled" type="checkbox"> Enable extension</label>
    <label><input id="smart" type="checkbox"> Smart mode</label>
    <label><input id="forceLayout" type="checkbox"> Force page layout RTL</label>
    <p>Smart mode keeps English-only paragraphs left-to-right. Forcing page layout RTL may change the position of some controls.</p>
    <button id="save">Save settings</button>
    <span id="status" role="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
