<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>RTL Everywhere</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>RTL Everywhere</h1>
    <p class="sub">Right-to-left reading, made simple.</p>
    <label class="row"><span>Enable extension</span><input id="enabled" type="checkbox"><i></i></label>
    <label class="row"><span>Smart mode</span><input id="smart" type="checkbox"><i></i></label>
    <label class="row"><span>Force page layout RTL</span><input id="forceLayout" type="checkbox"><i></i></label>
    <p class="hint">RTL text is enabled by default. Smart mode keeps English-only paragraphs left-to-right. Code and editing fields are excluded.</p>
    <button id="apply">Enable and apply now</button>
    <button id="options">Advanced settings</button>
    <div id="status" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
