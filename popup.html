<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>RTL Everywhere</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>RTL Everywhere</h1>
    <p class="sub">ترتيب النصوص العربية بسلاسة</p>
    <label class="row"><span>تفعيل الإضافة</span><input id="enabled" type="checkbox"><i></i></label>
    <label class="row"><span>الوضع الذكي للنص المختلط</span><input id="smart" type="checkbox"><i></i></label>
    <label class="row"><span>فرض RTL على تخطيط الصفحة</span><input id="forceLayout" type="checkbox"><i></i></label>
    <p class="hint">RTL للنصوص مفعّل تلقائيًا. الوضع الذكي يُبقي الفقرات الإنجليزية باتجاهها الأصلي. تبقى الأكواد والحقول محفوظة.</p>
    <button id="apply">تفعيل وتطبيق على الصفحة الآن</button>
    <button id="options">الإعدادات المتقدمة</button>
    <div id="status" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
